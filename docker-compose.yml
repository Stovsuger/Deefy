services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      # config propre à Docker : n'écrase pas votre db.config.ini
      - ./docker/db.config.ini:/var/www/html/db.config.ini:ro
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "mkdir -p audio && chown www-data:www-data audio && apache2-foreground"

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: deefy
      MARIADB_USER: deefy
      MARIADB_PASSWORD: deefy
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  dbdata:
